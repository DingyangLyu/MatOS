<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MatOS app icon: a crystal-lattice / agent-graph mark. The hexagonal
       cell reads as a material's unit cell; nodes and bonds double as an
       agent workflow graph. -->
  <defs>
    <linearGradient id="matos-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123B8C"/>
      <stop offset="0.55" stop-color="#0B63A8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="matos-glow" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#7DE9F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7DE9F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#matos-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#matos-glow)"/>

  <!-- bonds -->
  <g stroke="#EAF8FB" stroke-opacity="0.9" stroke-width="11" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="136"/>
    <line x1="256" y1="256" x2="360" y2="196"/>
    <line x1="256" y1="256" x2="360" y2="316"/>
    <line x1="256" y1="256" x2="256" y2="376"/>
    <line x1="256" y1="256" x2="152" y2="316"/>
    <line x1="256" y1="256" x2="152" y2="196"/>
    <!-- hexagonal cell edges -->
    <line x1="256" y1="136" x2="360" y2="196" stroke-opacity="0.45" stroke-width="8"/>
    <line x1="360" y1="196" x2="360" y2="316" stroke-opacity="0.45" stroke-width="8"/>
    <line x1="360" y1="316" x2="256" y2="376" stroke-opacity="0.45" stroke-width="8"/>
    <line x1="256" y1="376" x2="152" y2="316" stroke-opacity="0.45" stroke-width="8"/>
    <line x1="152" y1="316" x2="152" y2="196" stroke-opacity="0.45" stroke-width="8"/>
    <line x1="152" y1="196" x2="256" y2="136" stroke-opacity="0.45" stroke-width="8"/>
    <!-- growth bonds: the lattice extending, i.e. self-evolution -->
    <line x1="360" y1="196" x2="428" y2="158" stroke-opacity="0.6" stroke-width="8"/>
    <line x1="152" y1="316" x2="84" y2="354" stroke-opacity="0.6" stroke-width="8"/>
  </g>

  <!-- atoms / agent nodes -->
  <g>
    <circle cx="256" cy="136" r="22" fill="#FFFFFF"/>
    <circle cx="360" cy="196" r="22" fill="#FFFFFF"/>
    <circle cx="360" cy="316" r="22" fill="#FFFFFF"/>
    <circle cx="256" cy="376" r="22" fill="#FFFFFF"/>
    <circle cx="152" cy="316" r="22" fill="#FFFFFF"/>
    <circle cx="152" cy="196" r="22" fill="#FFFFFF"/>
    <circle cx="428" cy="158" r="13" fill="#9BEDF2"/>
    <circle cx="84" cy="354" r="13" fill="#9BEDF2"/>
    <!-- central atom -->
    <circle cx="256" cy="256" r="34" fill="#5EEAD4"/>
    <circle cx="256" cy="256" r="34" stroke="#FFFFFF" stroke-width="7" fill="none"/>
  </g>
</svg>
